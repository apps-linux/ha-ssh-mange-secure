name: "SSH Docker Manager"
version: "0.1.0"
slug: "ssh_docker_manager"
description: "Securely manage Docker containers on a remote Linux host over SSH, exposed to Home Assistant via MQTT."
url: "https://github.com/apps-linux/ha-ssh-mange-secure"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
services:
  - "mqtt:want"
map:
  - share:ro
options:
  ssh:
    host: ""
    port: 22
    username: ""
    key_mode: "generate"
    private_key: ""
    private_key_file: ""
    private_key_passphrase: ""
  mqtt:
    discovery_prefix: "homeassistant"
    broker_mode: "homeassistant"
    host: ""
    port: 1883
    username: ""
    password: ""
  poll_interval: 30
schema:
  ssh:
    host: "str"
    port: "port"
    username: "str"
    key_mode: "list(generate|paste|upload)"
    private_key: "str?"
    private_key_file: "str?"
    private_key_passphrase: "password?"
  mqtt:
    discovery_prefix: "str"
    broker_mode: "list(homeassistant|external)"
    host: "str?"
    port: "port?"
    username: "str?"
    password: "password?"
  poll_interval: "int(5,300)"
