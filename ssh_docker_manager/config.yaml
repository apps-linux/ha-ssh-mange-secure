name: "SSH Linux Management"
version: "0.7.4"
slug: "ssh_docker_manager"
description: "Securely manage Docker containers and libvirt VMs on multiple remote Linux hosts over SSH, exposed to Home Assistant via MQTT."
url: "https://github.com/apps-linux/ha-ssh-mange-secure"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
services:
  - "mqtt:want"
options:
  servers:
    - host: ""
      port: 22
      username: ""
      key_mode: "generate"
      private_key: ""
      private_key_passphrase: ""
      docker_enabled: true
      libvirt_enabled: false
      libvirt_connect_uri: "qemu:///system"
      monitoring_enabled: false
      monitoring_disk_paths: "/"
      poll_interval: 30
  mqtt:
    discovery_prefix: "homeassistant"
    broker_mode: "homeassistant"
    host: ""
    port: 1883
    username: ""
    password: ""
schema:
  servers:
    - host: "str"
      port: "port"
      username: "str"
      key_mode: "list(generate|paste)"
      private_key: "str?"
      private_key_passphrase: "password?"
      docker_enabled: "bool"
      libvirt_enabled: "bool"
      libvirt_connect_uri: "str"
      monitoring_enabled: "bool"
      monitoring_disk_paths: "str"
      poll_interval: "int(5,300)"
  mqtt:
    discovery_prefix: "str"
    broker_mode: "list(homeassistant|external)"
    host: "str?"
    port: "port?"
    username: "str?"
    password: "password?"
