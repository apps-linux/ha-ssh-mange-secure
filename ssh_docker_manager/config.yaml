name: "SSH Linux Management"
version: "0.6.1"
slug: "ssh_docker_manager"
description: "Securely manage Docker containers and libvirt VMs on a remote Linux host over SSH, exposed to Home Assistant via MQTT."
url: "https://github.com/apps-linux/ha-ssh-mange-secure"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
services:
  - "mqtt:want"
options:
  docker:
    enabled: true
  libvirt:
    enabled: false
    connect_uri: "qemu:///system"
  monitoring:
    enabled: false
    disk_paths:
      - "/"
  ssh:
    host: ""
    port: 22
    username: ""
    key_mode: "generate"
    private_key: ""
    private_key_passphrase: ""
  mqtt:
    discovery_prefix: "homeassistant"
    broker_mode: "homeassistant"
    host: ""
    port: 1883
    username: ""
    password: ""
  poll_interval: 30
schema:
  docker:
    enabled: "bool"
  libvirt:
    enabled: "bool"
    connect_uri: "str"
  monitoring:
    enabled: "bool"
    disk_paths:
      - "str"
  ssh:
    host: "str"
    port: "port"
    username: "str"
    key_mode: "list(generate|paste)"
    private_key: "str?"
    private_key_passphrase: "password?"
  mqtt:
    discovery_prefix: "str"
    broker_mode: "list(homeassistant|external)"
    host: "str?"
    port: "port?"
    username: "str?"
    password: "password?"
  poll_interval: "int(5,300)"
